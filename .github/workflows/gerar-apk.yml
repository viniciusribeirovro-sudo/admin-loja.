name: Gerar APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q admin-loja.zip && bash admin-loja/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: admin-loja-apk
          path: admin-loja/android/app/build/outputs/apk/debug/app-debug.apk
