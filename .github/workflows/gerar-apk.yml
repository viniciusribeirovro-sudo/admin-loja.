name: Gerar APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q admin-loja.zip -d projeto
          DIR=$(dirname "$(find projeto -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Usa o build.sh do projeto: permissão da câmera, ícones, versionCode crescente
      # e assinatura com a chave de release (secrets do GitHub).
      - name: Gerar APK
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: admin-loja-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/admin-loja-assinado.apk
